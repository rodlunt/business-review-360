<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Badge background: white pill, works on any background -->
  <rect x="1" y="1" width="198" height="54" rx="10" ry="10" fill="#FFFFFF" />
  <rect x="1" y="1" width="198" height="54" rx="10" ry="10" fill="none" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Icon: blue gradient rounded square -->
  <rect x="9" y="9" width="38" height="38" rx="8" ry="8" fill="url(#iconGrad)" />

  <!-- White "D" letterform inside icon -->
  <rect x="18" y="16" width="6" height="24" rx="2" fill="#FFFFFF" />
  <path d="M22 16 Q36 16 36 28 Q36 40 22 40" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark: "Demo" in slate -->
  <text
    x="58"
    y="27"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="-0.2"
    fill="#1E293B"
  >Demo</text>

  <!-- Wordmark: "CORP" in brand blue -->
  <text
    x="59"
    y="46"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="3"
    fill="#2563EB"
  >CORP</text>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet"
    /></noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Enterprise Idea Management - From Concept to Completion" />
    <title>Business Review 360</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden !important; /* No scrollbar on body - force it */
        background: #ffffff; /* Default background to prevent white flicker */
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden; /* Ensure root doesn't scroll either */
      }

      /* Themed scrollbar styles - thin and modern */
      * {
        scrollbar-width: thin; /* Firefox - thin scrollbar */
        scrollbar-color: rgba(0, 0, 0, 0.3) #f5f5f5; /* thumb track */
      }

      /* WebKit browsers (Chrome/Safari/Edge) - styled scrollbar */
      *::-webkit-scrollbar {
        width: 8px;
      }

      *::-webkit-scrollbar-track {
        background: #f5f5f5;
      }

      *::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.3);
        border-radius: 4px;
      }

      *::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.5);
      }

      /* Hide reCAPTCHA badge - display:none removes it from DOM and Lighthouse font-size audit */
      .grecaptcha-badge {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Lighthouse Test Token Injection - MUST run before React loads -->
    <script>
      (function () {
        // Check for test token in URL params (for Lighthouse audits)
        // This runs synchronously BEFORE React app loads to ensure token is available
        const urlParams = new URLSearchParams(window.location.search);
        const testToken = urlParams.get("__lighthouse_token");

        if (testToken) {
          console.log("[Lighthouse] Test token detected, injecting into localStorage AND cookie");

          // Set in localStorage (for React app)
          localStorage.setItem("token", testToken);

          // ALSO set as cookie (persists better through Lighthouse)
          document.cookie = `__lighthouse_auth=${testToken}; path=/; max-age=3600; SameSite=Lax`;

          // Remove the token from URL immediately to avoid exposing it in browser history
          const cleanUrl = window.location.pathname + window.location.hash;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        // If cookie exists but localStorage doesn't, copy it over
        const cookieMatch = document.cookie.match(/(?:^|;\s*)__lighthouse_auth=([^;]+)/);
        if (cookieMatch && !localStorage.getItem("token")) {
          console.log("[Lighthouse] Restoring token from cookie to localStorage");
          localStorage.setItem("token", cookieMatch[1]);
        }
      })();
    </script>

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>

# #835: classify the request Host so a tenant subdomain ROOT can serve
# the SPA (OrganizationLanding) while the apex root keeps serving the
# Hugo marketing homepage. A tenant subdomain is any single label under
# br360.example.com (a 3-label base domain, so a tenant host is 4 labels)
# that is not the bare apex. There is no `www` host any more, so it is
# no longer excluded here; if an org ever used "www" as its org id it
# would now resolve as an ordinary tenant subdomain. Everything else
# (apex, localhost, IPs, dev) -> 0 -> existing behaviour. This file is
# mounted at /etc/nginx/conf.d/default.conf, i.e. inside the stock
# nginx http{} block, so `map` (http context) is valid here.
map $host $is_tenant_subdomain {
    default                                                 0;
    "~^[^.]+\.br360\.example\.com$"                             1;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Do not include the internal port (3000) in redirect Location headers.
    # nginx is behind Caddy; absolute redirects using $server_port would send
    # browsers to :3000 instead of the Caddy-facing domain.
    port_in_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Backend health probe for the external uptime monitor (#815, Better
    # Stack). Exact match so it cannot shadow the SPA or marketing routes.
    # Without this, /health falls through to the static catch-all and
    # returns 200 + marketing HTML even when the backend is down.
    location = /health {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # API proxy
    location /api {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing website static assets (images, css, js)
    location ~ ^/(images|css|js)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # React app routes - handle /org paths. Falls through to the
    # @spa_fallback named location (not an inline /app/index.html) so the
    # SPA entry HTML is served with no-cache. An inline try_files target
    # triggers an internal redirect that re-matches `location /` and would
    # apply its max-age=3600, pinning browsers to a stale bundle post-deploy.
    location /org {
        try_files $uri @spa_fallback;
    }

    # Hugo-built blog (issue #651). Mounted ahead of the marketing/SPA
    # catch-all so /blog/* wins the prefix match. Server-level `root`
    # puts blog files at /usr/share/nginx/html/blog/, so no alias is
    # needed. Returns 404 on miss to keep blog routes from silently
    # falling through to /app/index.html (which would mask broken links).
    location /blog {
        try_files $uri $uri/ $uri.html =404;
    }

    # 7-day cache for blog static assets (#651 acceptance). Hugo asset
    # pipelines produce content-hashed filenames so a long cache is safe.
    location ~* ^/blog/.+\.(css|js|jpe?g|png|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # #835: ROOT path only. On a tenant subdomain, "/" serves the SPA
    # (no-cache /app/index.html via @spa_fallback) so React Router can
    # render <Route path="/"><SubdomainOnly><OrganizationLanding/>.
    # On the apex/www (and dev/localhost) "/" keeps serving the Hugo
    # marketing homepage, byte-for-byte the previous behaviour. Exact
    # match, so only "/" is affected; every deeper path (/login, /org,
    # /blog, /api, /about, assets) is untouched. The `return 418` +
    # `error_page 418 = @named` idiom is the documented-safe way to
    # branch to a named location from inside an `if`.
    location = / {
        error_page 418 = @spa_fallback;
        if ($is_tenant_subdomain) {
            return 418;
        }
        try_files $uri $uri.html $uri/ @spa_fallback;
        add_header Cache-Control "public, max-age=3600";
    }

    # Marketing website static files and React app assets
    location / {
        # Try static file first (marketing website), then .html extension, then React app
        try_files $uri $uri.html $uri/ @spa_fallback;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback: serve index.html with no-cache so users always pick up
    # the latest bundle after a deploy. Browsers cache old index.html otherwise
    # because the catch-all location has max-age=3600.
    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /app/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve React app static assets (Vite content-hashed filenames → long cache)
    location /assets {
        alias /usr/share/nginx/html/app/assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
